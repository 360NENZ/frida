name: Build artifacts

on:
  push:
  workflow_dispatch:
    inputs:
      sdk:
        description: Build SDK archives
        type: boolean
        default: false
      sdk_windows_only:
        description: Build only the Windows SDK
        type: boolean
        default: false

jobs:
  sdk:
    if: ${{ inputs.sdk }}
    uses: ./.github/workflows/build-sdk.yml
    with:
      windows_only: ${{ inputs.sdk_windows_only }}

  linux-x86_64:
    if: ${{ !inputs.sdk }}
    runs-on: ubuntu-latest
    env:
      CFLAGS: >-
        -ffile-prefix-map=../subprojects/frida-core=../subprojects/meshlink-core
        -ffile-prefix-map=../subprojects/frida-gum=../subprojects/meshlink-gum
      CXXFLAGS: >-
        -ffile-prefix-map=../subprojects/frida-core=../subprojects/meshlink-core
        -ffile-prefix-map=../subprojects/frida-gum=../subprojects/meshlink-gum
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch build submodules
        run: python3 tools/ensure-submodules.py frida-gum frida-core frida-python frida-tools
      - name: Verify kernel control contract
        run: python3 tools/check-kernel-control.py
      - name: Verify barebone x86 shim ABI
        run: python3 tools/check-barebone-shim.py
      - name: Verify barebone kernel bridge
        run: python3 tools/check-barebone-kmod-bridge.py
      - name: Verify barebone entrypoints
        run: python3 tools/check-barebone-entrypoints.py
      - name: Test Valac task name rewriter
        run: python3 -m unittest releng.tests.test_neutral_valac
      - name: Verify Darwin injection parameters
        run: python3 tools/check-darwin-parameters.py
      - name: Install Python development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
      - name: Configure
        run: >-
          ./configure
          --prefix="${{ runner.temp }}/frida"
          --enable-server
          --enable-gadget
          --enable-frida-python
          --enable-frida-tools
          --
          -Dfrida-core:compiler_backend=disabled
          -Dfrida-core:compat=disabled
          -Dfrida-core:tests=enabled
          -Dfrida-gum:tests=enabled
      - name: Compile
        run: make -j"$(nproc)"
      - name: Test local agent and host session
        run: |
          build/subprojects/frida-core/tests/frida-tests -p /Agent/Script/load-and-receive-messages
          build/subprojects/frida-core/tests/frida-tests -p /HostSession/Linux/backend
          build/subprojects/frida-core/tests/frida-tests -m slow -p /HostSession/Connectivity/Peer/flawless
          build/subprojects/frida-gum/tests/gum-tests -m slow \
            -p '/GumJS/Script/CModule/cmodule_can_be_defined_with_toolchain#QJS'
          build/subprojects/frida-gum/tests/gum-tests -m slow \
            -p '/GumJS/Script/CModule/cmodule_can_be_defined_with_toolchain#V8'
      - name: Install
        run: make install
      - name: Collect binaries
        run: |
          mkdir -p dist
          cp build/subprojects/frida-core/server/frida-server dist/meshlinkd
          cp build/subprojects/frida-core/lib/gadget/meshlink-gadget.so dist/libmeshlink.so
          dist/meshlinkd --version
      - name: Verify runtime identifiers
        run: |
          python3 -m unittest tools.test_runtime_identifiers
          python3 tools/check-runtime-identifiers.py dist/meshlinkd dist/libmeshlink.so
      - name: Locate generated identity literals
        if: failure()
        run: grep -R -n -F --include='*.c' '"Frida"' build/subprojects/frida-core | head -80 || true
      - name: Test matched remote client
        run: |
          build/subprojects/frida-core/server/frida-server -l 127.0.0.1:39117 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          frida_dir="$(find "${{ runner.temp }}/frida/lib" -name '_frida.abi3.so' -printf '%h\n' -quit)"
          test -n "$frida_dir"
          site_dir="${frida_dir%/frida}"
          for attempt in {1..20}; do
            if PYTHONPATH="$site_dir" python3 -c 'import frida; device = frida.get_device_manager().add_remote_device("127.0.0.1:39117"); assert device.enumerate_processes()'; then
              PYTHONPATH="$site_dir" python3 tools/smoke-rpc.py 127.0.0.1:39117 /bin/sleep 30
              PYTHONPATH="$site_dir" python3 tools/smoke-inspector.py 127.0.0.1:39117 /bin/sleep 30
              PYTHONPATH="$site_dir" python3 tools/smoke-runtime-paths.py 127.0.0.1:39117 /bin/sleep 30
              PYTHONPATH="$site_dir" python3 tools/smoke-cmodule.py 127.0.0.1:39117 /bin/sleep 30
              PYTHONPATH="$site_dir" python3 tools/smoke-cmodule.py --toolchain internal 127.0.0.1:39117 /bin/sleep 30
              exit
            fi
            sleep 1
          done
          exit 1
      - name: Package matched client
        run: |
          cd "${{ runner.temp }}/frida"
          frida_dir="$(find lib -name '_frida.abi3.so' -printf '%h\n' -quit)"
          test -n "$frida_dir"
          site_dir="${frida_dir%/frida}"
          cp "$GITHUB_WORKSPACE/docs/matched-client.md" README-client.md
          mv bin/frida-server bin/meshlinkd
          tar -czf "$GITHUB_WORKSPACE/dist/frida-client-linux-x86_64.tar.gz" \
            bin "$site_dir/frida" "$site_dir/frida_tools" README-client.md
      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frida-linux-x86_64
          path: |
            dist/meshlinkd
            dist/libmeshlink.so
          if-no-files-found: error
      - name: Upload matched client
        uses: actions/upload-artifact@v4
        with:
          name: frida-client-linux-x86_64
          path: dist/frida-client-linux-x86_64.tar.gz
          if-no-files-found: error

  windows-x86_64:
    if: ${{ !inputs.sdk }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch build submodules
        run: |
          git submodule update --init releng
          git -C releng submodule update --init
          python tools/ensure-submodules.py frida-core frida-python frida-tools
          python -m pip install setuptools
      - name: Test Valac task name rewriter
        run: python -m unittest releng.tests.test_neutral_valac
      - name: Configure
        run: >-
          .\configure
          --prefix="$Env:RUNNER_TEMP\frida"
          --host=windows-x86_64
          --enable-server
          --enable-frida-python
          --enable-frida-tools
          --
          "-Dfrida-core:compiler_backend=disabled"
          "-Dfrida-core:compat=disabled"
          "-Dfrida-core:tests=disabled"
      - name: Compile
        run: .\make
      - name: Install
        run: .\make install
      - name: Package matched client
        run: |
          $prefix = "$Env:RUNNER_TEMP\frida"
          $wheels = "$Env:RUNNER_TEMP\meshlink-client\wheels"
          New-Item -ItemType Directory -Force $wheels | Out-Null
          $Env:MESON_SOURCE_ROOT = $Env:GITHUB_WORKSPACE
          git -C subprojects/frida-python fetch --tags --depth=128 origin
          git -C subprojects/frida-tools fetch --tags --depth=128 origin
          $toolsBuild = (Resolve-Path build\subprojects\frida-tools).Path
          New-Item -ItemType Junction -Path subprojects\frida-tools\build `
            -Target $toolsBuild | Out-Null
          $Env:FRIDA_EXTENSION = "$prefix\lib\site-packages\frida\_frida.pyd"
          if (-not (Test-Path $Env:FRIDA_EXTENSION)) {
            throw "Missing matched Windows Python extension"
          }
          $versionOutput = (& "$prefix\bin\frida-server.exe" --version 2>&1) -join ' '
          Write-Host "Built server version: $versionOutput"
          if ($LASTEXITCODE -ne 0 -or $versionOutput -notmatch '^\d+\.\d+\.\d+(?:-dev\.\d+)?$') {
            throw "Could not determine the built server version"
          }
          $Env:FRIDA_VERSION = $versionOutput.Replace('-dev.', '.dev')
          python -m pip wheel --no-deps -w $wheels .\subprojects\frida-python
          python -m pip wheel --no-deps -w $wheels .\subprojects\frida-tools
          python -m pip download --only-binary=:all: --dest $wheels `
            'colorama>=0.2.7,<1' 'prompt-toolkit>=2,<4' `
            'pygments>=2,<3' 'websockets>=13,<14' 'wcwidth>=0.2.5'
          Copy-Item docs\matched-client-windows.md "$Env:RUNNER_TEMP\meshlink-client\README.md"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$Env:RUNNER_TEMP\meshlink-client\*" `
            -DestinationPath dist\meshlink-client-windows-x86_64.zip
      - name: Test packaged client
        run: |
          $venv = "$Env:RUNNER_TEMP\client-smoke"
          python -m venv $venv
          $python = "$venv\Scripts\python.exe"
          & $python -m pip install --pre --no-index `
            --find-links "$Env:RUNNER_TEMP\meshlink-client\wheels" frida frida-tools
          if ($LASTEXITCODE -ne 0) { throw "Offline client installation failed" }
          $server = Start-Process -FilePath "$Env:RUNNER_TEMP\frida\bin\frida-server.exe" `
            -ArgumentList '-l', '127.0.0.1:39117' -WindowStyle Hidden -PassThru
          try {
            $connected = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              & $python -c 'import frida; d = frida.get_device_manager().add_remote_device("127.0.0.1:39117"); assert d.enumerate_processes()'
              if ($LASTEXITCODE -eq 0) { $connected = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $connected) { throw "Packaged client could not reach matched server" }
            & "$venv\Scripts\frida-ps.exe" -H 127.0.0.1:39117
            if ($LASTEXITCODE -ne 0) { throw "Packaged CLI failed" }
            & $python tools\smoke-rpc.py 127.0.0.1:39117 $python -c 'import time; time.sleep(30)'
            if ($LASTEXITCODE -ne 0) { throw "Packaged client RPC failed" }
            & $python tools\smoke-inspector.py 127.0.0.1:39117 $python -c 'import time; time.sleep(30)'
            if ($LASTEXITCODE -ne 0) { throw "Packaged client inspector failed" }
            & $python tools\smoke-runtime-paths.py 127.0.0.1:39117 $python -c 'import time; time.sleep(30)'
            if ($LASTEXITCODE -ne 0) { throw "Packaged client runtime paths failed" }
            & $python tools\smoke-cmodule.py --toolchain internal 127.0.0.1:39117 $python -c 'import time; time.sleep(30)'
            if ($LASTEXITCODE -ne 0) { throw "Packaged client internal CModule failed" }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
      - name: Upload matched client
        uses: actions/upload-artifact@v4
        with:
          name: meshlink-client-windows-x86_64
          path: dist/meshlink-client-windows-x86_64.zip
          if-no-files-found: error

  android-arm64:
    if: ${{ !inputs.sdk }}
    runs-on: ubuntu-latest
    env:
      CFLAGS: >-
        -ffile-prefix-map=../subprojects/frida-core=../subprojects/meshlink-core
        -ffile-prefix-map=../subprojects/frida-gum=../subprojects/meshlink-gum
      CXXFLAGS: >-
        -ffile-prefix-map=../subprojects/frida-core=../subprojects/meshlink-core
        -ffile-prefix-map=../subprojects/frida-gum=../subprojects/meshlink-gum
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch build submodules
        run: python3 tools/ensure-submodules.py frida-gum frida-core
      - name: Verify Darwin injection parameters
        run: python3 tools/check-darwin-parameters.py
      - name: Test Valac task name rewriter
        run: python3 -m unittest releng.tests.test_neutral_valac
      - name: Set up NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false
      - name: Export NDK root
        run: echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - name: Configure
        run: >-
          ./configure
          --prefix="${{ runner.temp }}/frida-android"
          --host=android-arm64
          --enable-server
          --enable-gadget
          --disable-frida-python
          --disable-frida-tools
          --
          -Dlibdir=lib
          -Dfrida-core:compiler_backend=disabled
          -Dfrida-core:compat=disabled
      - name: Compile
        run: make -j2
      - name: Install
        run: make install
      - name: Collect binaries
        run: |
          mkdir -p dist
          cp "${{ runner.temp }}/frida-android/bin/frida-server" dist/meshlinkd
          cp "${{ runner.temp }}/frida-android/lib/frida-1.0/64/meshlink-gadget.so" dist/libmeshlink.so
      - name: Verify runtime identifiers
        run: |
          python3 -m unittest tools.test_runtime_identifiers
          python3 tools/check-runtime-identifiers.py dist/meshlinkd dist/libmeshlink.so
      - name: Locate generated identity literals
        if: failure()
        run: grep -R -n -F --include='*.c' '"Frida"' build/subprojects/frida-core | head -80 || true
      - name: Verify zymbiote exports
        run: |
          if grep -a -q 'frida_zymbiote_replacement_' dist/meshlinkd; then
            echo "Legacy zymbiote export remains in server"
            exit 1
          fi
          grep -a -q 'relay_zymbiote_replacement_setargv0' dist/meshlinkd
          grep -a -q 'relay_zymbiote_replacement_setcontext' dist/meshlinkd
      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frida-android-arm64
          path: dist/
          if-no-files-found: error
